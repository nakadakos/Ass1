<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopLite | Microservices</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#182230;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#182230;color:white;padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header h1{margin:0;font-size:24px}header small{color:#c6d2e0}.wrap{max-width:1100px;margin:28px auto;padding:0 20px}.hero{background:linear-gradient(120deg,#ddf8ef,#fff);padding:28px;border-radius:18px;margin-bottom:24px}.hero h2{margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:white;border:1px solid #e5eaf1;border-radius:16px;padding:20px;box-shadow:0 5px 20px #172b4d0a}.emoji{font-size:42px;background:#effaf5;border-radius:14px;padding:18px;text-align:center}.price{font-size:21px;font-weight:750;margin:12px 0}.btn{border:0;background:#087f5b;color:white;padding:11px 15px;border-radius:9px;cursor:pointer;font-weight:650}.btn:hover{background:#06684b}.panel{margin-top:26px;background:white;border:1px solid #e5eaf1;border-radius:16px;padding:22px}input{padding:11px;border:1px solid #ccd5e1;border-radius:8px;width:100%;max-width:360px;margin:8px 0 12px}li{margin:8px 0}.muted{color:#637083}.status{margin-top:12px;font-weight:600}
</style></head><body>
<header><div><h1>ShopLite</h1><small>Simple online store</small></div><div>MICROSERVICES APP</div></header>
<main class="wrap"><section class="hero"><h2>Shop independently. Checkout simply.</h2><p class="muted">The gateway communicates with separate Product, Cart and Order services.</p><strong>Architecture: Microservices</strong></section>
<h2>Featured products</h2><div id="products" class="grid"></div>
<section class="panel"><h2>Your cart</h2><ul id="cart"></ul><p id="total"><b>Total: ₹0.00</b></p><label for="customer">Your name</label><br><input id="customer" placeholder="Enter your name"><br><button class="btn" onclick="checkout()">Place order</button><div id="status" class="status" role="status"></div></section>
<section class="panel"><h3>Recent orders</h3><button class="btn" onclick="loadOrders()">Refresh orders</button><ul id="orders"></ul></section></main>
<script>
let products=[],cart={};const money=n=>'₹'+Number(n).toFixed(2);
async function init(){try{products=await(await fetch('/api/products')).json();renderProducts();renderCart()}catch(e){document.getElementById('products').textContent='Could not load products.'}}
function renderProducts(){document.getElementById('products').innerHTML=products.map(p=>`<article class="card"><div class="emoji">${p.emoji}</div><h3>${p.name}</h3><div class="price">${money(p.price)}</div><button class="btn" onclick="add(${p.id})">Add to cart</button></article>`).join('')}
function add(id){cart[id]=(cart[id]||0)+1;renderCart()}
function renderCart(){let es=Object.entries(cart).filter(([id,q])=>q>0);document.getElementById('cart').innerHTML=es.length?es.map(([id,q])=>{let p=products.find(x=>x.id===Number(id));return `<li>${p.name} × ${q} <button onclick="change(${id},-1)">−</button> <button onclick="change(${id},1)">+</button></li>`}).join(''):'<li>Your cart is empty.</li>';let total=es.reduce((s,[id,q])=>s+products.find(p=>p.id===Number(id)).price*q,0);document.getElementById('total').innerHTML='<b>Total: '+money(total)+'</b>'}
function change(id,n){cart[id]=Math.max(0,(cart[id]||0)+n);renderCart()}
async function checkout(){let items=Object.entries(cart).filter(([id,q])=>q>0).map(([id,qty])=>{let p=products.find(x=>x.id===Number(id));return{id:Number(id),qty,name:p.name,price:p.price}});let status=document.getElementById('status');try{let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:document.getElementById('customer').value,items})});let d=await r.json();status.textContent=r.ok?`${d.message} Order #${d.order_id}, total ${money(d.total)}.`:(d.error||'Order failed.');if(r.ok){cart={};renderCart();loadOrders()}}catch(e){status.textContent='Server connection failed.'}}
async function loadOrders(){try{let r=await fetch('/api/orders');let data=await r.json();document.getElementById('orders').innerHTML=data.length?data.map(o=>`<li>Order #${o.id} · ${o.customer} · ${money(o.total)}</li>`).join(''):'<li>No orders yet.</li>'}catch(e){document.getElementById('orders').innerHTML='<li>Order service unavailable.</li>'}}
init();loadOrders();
</script></body></html>
